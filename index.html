<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeepReader</title>
<meta name="description" content="英文原著阅读伴侣：逐句解析、词汇卡、朗读、书中记忆">
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DeepReader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ 书架 ============ -->
  <section id="view-library" class="view">
    <header class="lib-head">
      <div class="brand">
        <span class="brand-mark">D</span>
        <div>
          <h1>DeepReader</h1>
          <p class="sub">语言理解 → 文学理解 → 知识留存</p>
        </div>
      </div>
      <div class="lib-actions">
        <button class="icon-btn" id="btn-vocab" title="生词本" aria-label="生词本"><svg><use href="#i-words"/></svg></button>
        <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <div class="lib-body">
      <div class="import-row">
        <label class="btn primary file-btn">
          <svg><use href="#i-plus"/></svg> 导入电子书
          <input type="file" id="file-input" accept=".epub,.pdf,.txt,.md,.markdown,.html,.htm,.xhtml,.docx,.fb2" hidden>
        </label>
        <button class="btn" id="btn-paste"><svg><use href="#i-paste"/></svg> 粘贴文本</button>
      </div>
      <p class="hint">支持 EPUB、PDF、TXT、Markdown、HTML、DOCX、FB2，单个文件最大 1000 MB。书籍只保存在你自己的设备上。</p>
      <div id="ai-banner" class="banner" hidden>
        <div>
          <strong>还没有设置 AI</strong>
          <span>阅读、朗读、划线都能直接用。逐句解析和词汇卡需要一个免费的 AI Key（千问 / 智谱 / Gemini）。</span>
        </div>
        <button class="btn small" id="btn-banner-ai">去设置</button>
      </div>
      <ul id="book-list" class="book-list"></ul>
    </div>
  </section>

  <!-- ============ 阅读器 ============ -->
  <section id="view-reader" class="view" hidden>
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="btn-back" title="返回书架" aria-label="返回书架"><svg><use href="#i-back"/></svg></button>
        <button class="icon-btn" id="btn-search" title="全文搜索" aria-label="全文搜索"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="btn-toc" title="目录" aria-label="目录"><svg><use href="#i-list"/></svg></button>
      </div>
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-right">
        <button class="icon-btn" id="btn-readall" title="从当前句连续朗读" aria-label="连续朗读"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-memory" title="书中记忆：人物、概念、划线" aria-label="书中记忆"><svg><use href="#i-brain"/></svg></button>
        <button class="icon-btn" id="btn-settings2" title="设置" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <div class="progress-line"><div id="progress-fill"></div></div>

    <div class="reader-shell">
      <main id="reader-scroll" class="reader-scroll">
        <article id="reader" class="reader"></article>
        <nav class="chapter-nav">
          <button class="btn" id="btn-prev-ch">上一章</button>
          <span id="ch-indicator"></span>
          <button class="btn" id="btn-next-ch">下一章</button>
        </nav>
      </main>

      <aside id="panel" class="panel" hidden aria-label="解析面板">
        <div class="panel-grip" id="panel-grip"></div>
        <div id="panel-scroll" class="panel-scroll"></div>
      </aside>
    </div>
  </section>
</div>

<!-- ============ 通用弹层 ============ -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button class="icon-btn" id="sheet-close" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<!-- ============ 图标 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="4" cy="12" r="1.3" fill="currentColor"/><circle cx="4" cy="18" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-words" viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M12 5.5a3 3 0 00-5.6-1.2A3.2 3.2 0 004 8a3.3 3.3 0 00.6 5.6A3.4 3.4 0 008 19a3 3 0 004 .5M12 5.5a3 3 0 015.6-1.2A3.2 3.2 0 0120 8a3.3 3.3 0 01-.6 5.6A3.4 3.4 0 0116 19a3 3 0 01-4 .5M12 5.5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 4h4M6.5 7l1 13h9l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
